<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QubitX — Learn, simulate, experiment, and understand quantum computing through interactive lessons, visualizations, and a real in-browser quantum simulator." />
    <title>QubitX · Quantum Computing, Made Understandable</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("qubitx-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
